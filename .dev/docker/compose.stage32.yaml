name: bervel-stage32

x-n8n-environment: &n8n-environment
  DB_TYPE: postgresdb
  DB_POSTGRESDB_HOST: postgres
  DB_POSTGRESDB_PORT: "5432"
  DB_POSTGRESDB_DATABASE: bervel_stage32_n8n
  DB_POSTGRESDB_USER: postgres
  DB_POSTGRESDB_PASSWORD: ${STAGE32_DB_PASSWORD:?Initialize test.env}
  N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY:?Initialize test.env}
  EXECUTIONS_MODE: queue
  QUEUE_BULL_REDIS_HOST: redis
  QUEUE_BULL_REDIS_PASSWORD: ${REDIS_PASSWORD:?Initialize test.env}
  QUEUE_BULL_REDIS_DB: "0"
  QUEUE_BULL_PREFIX: bervel-stage32
  N8N_REDIS_KEY_PREFIX: bervel-stage32
  OFFLOAD_MANUAL_EXECUTIONS_TO_WORKERS: "true"
  N8N_HOST: 127.0.0.1
  N8N_PORT: "5688"
  N8N_LISTEN_ADDRESS: 0.0.0.0
  N8N_PROTOCOL: http
  N8N_SECURE_COOKIE: "false"
  N8N_DIAGNOSTICS_ENABLED: "false"
  N8N_VERSION_NOTIFICATIONS_ENABLED: "false"
  N8N_PERSONALIZATION_ENABLED: "false"
  EXECUTIONS_DATA_SAVE_ON_ERROR: all
  EXECUTIONS_DATA_SAVE_ON_SUCCESS: all
  EXECUTIONS_DATA_SAVE_ON_PROGRESS: "true"
  QUEUE_WORKER_LOCK_DURATION: "10000"
  QUEUE_WORKER_LOCK_RENEW_TIME: "1000"
  QUEUE_WORKER_STALLED_INTERVAL: "1000"
  N8N_GRACEFUL_SHUTDOWN_TIMEOUT: "2"

services:
  postgres:
    image: postgres:17.9-bookworm@sha256:47f917f7409eacd22fc5dfb1dee634e1b55cf0c01d1a7eb701be2227a03e0641
    environment:
      POSTGRES_PASSWORD: ${STAGE32_DB_PASSWORD:?Initialize test.env}
      POSTGRES_DB: bervel_stage32
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./stage32-init.sql:/docker-entrypoint-initdb.d/stage32.sql:ro
    healthcheck:
      test: [CMD-SHELL, pg_isready -U postgres -d bervel_stage32]
      interval: 2s
      timeout: 2s
      retries: 30

  redis:
    image: redis:7.4.7-alpine@sha256:02f2cc4882f8bf87c79a220ac958f58c700bdec0dfb9b9ea61b62fb0e8f1bfcf
    user: redis
    environment: {REDIS_PASSWORD: "${REDIS_PASSWORD:?Initialize test.env}"}
    command: [sh, -ec, 'exec redis-server --appendonly yes --requirepass "$$REDIS_PASSWORD"']
    volumes: [redis_data:/data]
    healthcheck:
      test: [CMD-SHELL, 'REDISCLI_AUTH="$$REDIS_PASSWORD" redis-cli ping | grep -qx PONG']
      interval: 2s
      timeout: 2s
      retries: 30

  migrate:
    image: bervel-api:stage32
    build: {context: ../..}
    command: [python, -m, bervel, migrate]
    environment:
      BERVEL_DATABASE_URL: postgresql+psycopg://postgres:${STAGE32_DB_PASSWORD}@postgres:5432/bervel_stage32
    depends_on: {postgres: {condition: service_healthy}}

  api:
    image: bervel-api:stage32
    init: true
    environment:
      BERVEL_DATABASE_URL: postgresql+psycopg://postgres:${STAGE32_DB_PASSWORD}@postgres:5432/bervel_stage32
      BERVEL_OBJECT_ROOT: /data/objects
      BERVEL_HOST: 0.0.0.0
      BERVEL_ACCESS_KEYS: ${BERVEL_ACCESS_KEYS:?Initialize test.env}
      BERVEL_PROCESS_WORKER_KEY: ${BERVEL_PROCESS_WORKER_KEY:?Initialize test.env}
      BERVEL_N8N_URL: ${BERVEL_N8N_URL:-}
      BERVEL_N8N_API_KEY: ${BERVEL_N8N_API_KEY:-}
      BERVEL_N8N_WEBHOOK_KEY: ${BERVEL_N8N_WEBHOOK_KEY:-}
      BERVEL_N8N_WORKFLOW_ID: ${BERVEL_N8N_WORKFLOW_ID:-}
      BERVEL_N8N_CALLBACK_URL: http://api:8011
    volumes: [objects:/data/objects]
    ports: ["127.0.0.1:18011:8011"]
    depends_on: {migrate: {condition: service_completed_successfully}}
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8011/health/ready',timeout=2)"]
      interval: 2s
      timeout: 2s
      retries: 30

  n8n-main:
    image: docker.n8n.io/n8nio/n8n:2.43.5@sha256:4fc4c67bf5fb990201a71d94c7070abf8dd0619cb8af1d059877a447f3640392
    command: [start]
    environment: *n8n-environment
    volumes: [n8n_main_data:/home/node/.n8n]
    ports: ["127.0.0.1:15688:5688"]
    depends_on: {postgres: {condition: service_healthy}, redis: {condition: service_healthy}}
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:5688/healthz/readiness').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 3s
      timeout: 3s
      retries: 40

  n8n-worker:
    image: docker.n8n.io/n8nio/n8n:2.43.5@sha256:4fc4c67bf5fb990201a71d94c7070abf8dd0619cb8af1d059877a447f3640392
    command: [worker, --concurrency=2]
    environment:
      <<: *n8n-environment
      QUEUE_HEALTH_CHECK_ACTIVE: "true"
      QUEUE_HEALTH_CHECK_PORT: "5688"
    volumes: [n8n_worker_data:/home/node/.n8n]
    depends_on: {n8n-main: {condition: service_healthy}}
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:5688/healthz/readiness').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 3s
      timeout: 3s
      retries: 40

  gate:
    image: bervel-api:stage32
    command: [python, /probe/stage32_gate.py]
    volumes: [../scripts/stage32_gate.py:/probe/stage32_gate.py:ro]
    ports: ["127.0.0.1:15699:5699"]

volumes:
  postgres_data:
  objects:
  redis_data:
  n8n_main_data:
  n8n_worker_data:
