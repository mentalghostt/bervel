<script>
'use strict';
const D=JSON.parse(document.getElementById('map-data').textContent);
const $=id=>document.getElementById(id),N=new Map(D.nodes.map(n=>[n.id,n])),children=new Map(),outgoing=new Map(),incoming=new Map();
for(const n of D.nodes)if(n.parent){if(!children.has(n.parent))children.set(n.parent,[]);children.get(n.parent).push(n.id);}
for(const e of D.edges){if(!outgoing.has(e.from))outgoing.set(e.from,[]);outgoing.get(e.from).push(e);if(!incoming.has(e.to))incoming.set(e.to,[]);incoming.get(e.to).push(e);}
const names={project:'проект',module:'часть приложения',package:'пакет / каталог',file:'файл',class:'класс',type:'тип данных',function:'функция',method:'метод',parameter:'параметр',variable:'переменная',field:'поле',constant:'константа',import:'имя импорта',scope:'область видимости',external:'внешний вызов'};
const verbs={contains:'содержит',calls:'вызывает',method_ref:'ссылка на метод',external_call:'внешний вызов',imports:'импортирует',uses:'использует',automatic:'пояснение: dataclass',transport:'пояснение: HTTP',route:'далее'};
const certainties={'syntax':'имя / импорт в коде','member-reference':'self/cls или цепочка полей; runtime-адресат не доказан','inferred':'вывод типа из присваивания','class-reference':'cls текущего класса','type-reference':'ссылка по TypeScript Symbol','external-syntax':'внешний вызов из AST','explained':'ручное пояснение механизма'};
let state={tab:'code',archView:'context',archSelected:'system',focus:'root',selected:'root',mode:'normal',page:0,x:0,y:0,scale:1,positions:new Map(),width:1,height:1};
const pageSize=12;
function el(tag,cls,text){const e=document.createElement(tag);if(cls)e.className=cls;if(text!==undefined)e.textContent=text;return e;}
function button(text,fn,cls){const b=el('button',cls,text);b.type='button';b.addEventListener('click',fn);return b;}
function title(n){return names[n.kind]||n.kind;}
function ancestors(id){const a=[];for(let n=N.get(id);n;n=N.get(n.parent))a.unshift(n.id);return a;}
function short(n){return n.subtitle||n.file? n.subtitle||n.file.replace('src/bervel/','')+(n.kind==='file'?'':':'+n.line):title(n);}
function count(id){return(children.get(id)||[]).length;}
function navigate(id,mode='normal'){state.tab='code';state.focus=id;state.selected=id;state.mode=mode;state.page=0;render();select(id);fit();save();}
function locate(id){const n=N.get(id);if(!n)return;state.tab='code';if(n.kind==='import')$('showimports').checked=true;if(['variable','parameter','field','constant'].includes(n.kind))$('showvalues').checked=true;state.focus=n.parent||id;state.mode='normal';state.selected=id;const list=visibleChildren(state.focus);state.page=Math.max(0,Math.floor(list.indexOf(id)/pageSize));render();select(id);fit();save();}
function save(){try{const h=new URLSearchParams({tab:state.tab,node:state.selected,view:state.focus,mode:state.mode,c4:state.archView,entity:state.archSelected,relation:$('relation-kind').value});history.replaceState(null,'','#'+h);}catch{}}
function visibleChildren(id){return(children.get(id)||[]).filter(i=>{const n=N.get(i);return($('showvalues').checked||!['variable','parameter','field','constant'].includes(n.kind))&&($('showimports').checked||n.kind!=='import');}).sort((a,b)=>{const rank={package:0,file:1,class:2,type:3,function:4,method:4,scope:5,parameter:6,variable:7,field:8,constant:8,import:9};return(rank[N.get(a).kind]??0)-(rank[N.get(b).kind]??0)|| (N.get(a).line||0)-(N.get(b).line||0);});}
/*__ATLAS_JS__*/
function paragraph(text,cls){const p=el('p',cls,text);$('details').append(p);return p;}
function heading(text){$('details').append(el('h3','',text));}
function scopeName(n){return ancestors(n.parent).map(id=>N.get(id).name).join(' → ');}
function observation(n){
 const kind=title(n);
 if(n.kind==='file')return `Физический файл ${n.file}. Разбор: ${D.files[n.file].parser}. Ниже можно раскрыть найденные определения. Назначение каждой операции следует проверять по её телу и связям.`;
 if(['function','method'].includes(n.kind)){const calls=n.calls||[],actions=[...new Set(calls.map(c=>c.text))].slice(0,5);return `${n.kind==='method'?'Метод класса':'Функция'} ${n.name}. ${actions.length?'В теле обращается к '+actions.join(', ')+'. ':'В теле не найдено явных вызовов. '}${n.returnExpressions?.length?'Возвращаемое выражение: '+n.returnExpressions[0].slice(0,150)+'. ':''}${n.doc?'Комментарий автора приведён ниже. ':''}Это наблюдение по коду; бизнес-назначение вручную не описано.`;}
 if(n.kind==='class')return `Класс ${n.name} объединяет поля и методы. Экземпляр — отдельный набор значений этих полей. Само наличие класса не говорит, когда он создаётся: это видно по входящим вызовам.`;
 if(n.kind==='parameter'&&n.name==='self')return 'self — текущий экземпляр класса. Python автоматически передаёт его в метод при вызове через объект. Например, self.repository — репозиторий именно этого экземпляра. Имя видно в определении, отдельно передавать его при обычном вызове не нужно.';
 if(n.kind==='parameter'&&n.name==='cls')return 'cls — класс, переданный Python в метод с @classmethod. Например, cls(...) создаёт экземпляр этого класса. Это имя не содержит настройки само по себе.';
 if(n.kind==='parameter')return `Входное имя ${n.name} в ${N.get(n.parent)?.name}. Значение передаёт вызывающий код. Тип и действия с ним показаны ниже; предметный смысл по одному имени не установлен.`;
 if(['variable','constant','field'].includes(n.kind))return `${kind[0].toUpperCase()+kind.slice(1)} ${n.name}. Область: ${N.get(n.parent)?.name}. ${n.value?'Справа приведено выражение присваивания из исходника. ':''}Ссылки показывают, какие действия читают это имя. Они не доказывают конкретное значение во время работы.`;
 if(n.kind==='import')return `Имя, полученное через импорт ${n.importPath||''}. Оно позволяет этому файлу обратиться к определению в другом модуле или библиотеке.`;
 if(n.kind==='type')return `Описание формы данных ${n.name}. TypeScript использует его при проверке кода; само объявление типа не запускает действие.`;
 if(n.kind==='scope')return 'Отдельная область имён внутри выражения или блока. Она помогает различить одноимённые локальные переменные. Раскройте узел для найденных значений и вложенных действий.';
 return 'Сущность извлечена из исходного кода. Её роль уточняется по родительской области, источнику и связям.';
}
function link(id,caption,extra){const n=N.get(id),b=button(caption||n.name,()=>locate(id),'relation');if(extra)b.append(el('small','',extra));return b;}
function relationList(edges,reverse=false){
 const uniq=new Map();for(const e of edges){const id=reverse?e.from:e.to;const key=id+'|'+e.kind;if(!uniq.has(key))uniq.set(key,e);}
 const items=[...uniq.values()];const box=el('div');for(const e of items.slice(0,60)){const id=reverse?e.from:e.to,n=N.get(id),b=link(id,`${reverse?'←':'→'} ${n.name}`,`${verbs[e.kind]} · ${n.file||n.subtitle||''}${e.line?' · L'+e.line:''} · ${certainties[e.certainty]||e.certainty}`);if(e.proof)b.append(el('span','proof',e.proof));box.append(b);}
 if(items.length>60)box.append(el('p','subtle',`Первые 60 из ${items.length}. Остальные доступны через поиск и уровни карты.`));$('details').append(box);
}
function select(id){
 const n=N.get(id);if(!n)return;state.selected=id;highlight();$('details').replaceChildren();
 $('details').append(el('div','eyebrow',title(n)),el('h2','',n.name));
 if(n.file)$('details').append(el('div','file-path',`${n.file}\nстроки ${n.line}–${n.end}`));
 paragraph(n.description||observation(n));
 if(n.reviewed)paragraph('Пояснение проверено вручную по исходнику','reviewed');
 if(count(id))$('details').append(button('Внутрь: '+count(id)+' сущностей',()=>navigate(id),'primary'));
 if(id==='group:launch')$('details').append(button('Как запускается serve',()=>navigate('group:launch','startup'),'primary'));
 if(n.parent){heading('Где находится');$('details').append(link(n.parent,N.get(n.parent).name,scopeName(n)));}
 if(n.signature){heading('Определение');paragraph(n.signature,'facts');}
 const params=(children.get(id)||[]).filter(i=>N.get(i).kind==='parameter');
 if(['function','method'].includes(n.kind)){
   heading('Входы');if(!params.length)paragraph('Явных параметров нет. Функция может читать имена из внешней области.','subtle');for(const p of params)$('details').append(link(p,N.get(p).name,N.get(p).annotation||'Тип в определении не указан'));
   heading('Выход');paragraph(n.returns?'Аннотация: '+n.returns:'Тип результата явно не указан.','facts');
   const returns=[...new Set(n.returnExpressions||[])];if(returns.length){const d=el('details');d.append(el('summary','',`Выражения return · ${returns.length}`),el('pre','source',returns.join('\n')));$('details').append(d);}else paragraph('Явных return-выражений не найдено. Python без return возвращает None; JavaScript — undefined.','subtle');
 }
 if(n.annotation){heading('Тип / форма');paragraph(n.annotation,'facts');}
 if(n.value){heading('Задаётся выражением');paragraph(n.value,'facts');}
 if(n.writes?.length){heading('Места присваивания');paragraph([...new Set(n.writes)].map(x=>'L'+x).join(', '),'facts');}
 if(n.doc){const d=el('details');d.append(el('summary','','Комментарий в исходнике'),el('pre','source',n.doc));$('details').append(d);}
 if(state.mode==='startup')startupExplanation();
 const outs=(outgoing.get(id)||[]).filter(e=>e.kind!=='contains'&&(e.kind!=='uses'||$('showuses').checked));
 const ins=(incoming.get(id)||[]).filter(e=>e.kind!=='contains'&&(e.kind!=='uses'||['variable','field','constant','parameter'].includes(n.kind)||$('showuses').checked));
 if(outs.length){heading('Куда обращается');relationList(outs);}
 if(ins.length){heading(['variable','field','constant','parameter'].includes(n.kind)?'Где используется имя':'Кто обращается сюда');relationList(ins,true);}
 const calls=n.calls||[];if(calls.length){const d=el('details');d.open=calls.length<9;d.append(el('summary','',`Все выражения вызова в теле · ${calls.length}`));for(const c of calls){const args=[...(c.arguments||[]),...(c.keywords||[])].join(', ');if(c.target){const b=link(c.target,c.text+'(…) · L'+c.line,(verbs[c.bindingKind]||'ссылка')+' · '+(certainties[c.certainty]||c.certainty||'')+'\n'+args);if(c.proof)b.append(el('span','proof',c.proof));d.append(b);}else{const p=el('div','notice');p.append(el('div','code-token',c.text+'(…) · L'+c.line),el('div','',c.reason));if(args)p.append(el('div','facts',args));d.append(p);}}$('details').append(d);}
 if(n.file){heading('Реальный исходник');const info=D.files[n.file],lines=info.source.split('\n'),start=Math.max(1,n.line-2),end=Math.min(lines.length,n.end+2,start+89);const pre=el('pre','source');pre.setAttribute('aria-label','Исходный код');for(let i=start;i<=end;i++){const s=el('span',i>=n.line&&i<=n.end?'active':'');s.append(el('span','lineno',String(i)),document.createTextNode(lines[i-1]));pre.append(s);}$('details').append(pre);if(end<n.end)paragraph(`Показаны строки ${start}–${end} из ${n.end}. Полный текст доступен в карточке файла.`, 'subtle');
   const d=el('details');d.append(el('summary','','Полный файл · '+lines.length+' строк · SHA-256'),el('p','facts',info.sha256));d.addEventListener('toggle',()=>{if(d.open&&!d.querySelector('pre'))d.append(el('pre','source',info.source));});$('details').append(d);
 }
 if(id==='root'){heading('С чего начать');paragraph('Выберите узел «Запуск и сборка» и кнопку «Как запускается serve» в его карточке. Затем раскройте «Чат» → service.py → ChatService: это путь от части приложения к конкретным действиям.');paragraph('Тип стрелок выбирается над диаграммой: импорты, вызовы, ссылки на методы, HTTP или состав. Не смешивайте зависимость исходного кода и runtime-вызов. У ссылки на метод реальный объект во время выполнения не доказан. Подробности и основания — в карточке.','notice');}
 $('details').scrollTop=0;$('announcement').textContent=`Выбрано: ${n.name}, ${title(n)}`;save();
}
function startupExplanation(){heading('Маршрут serve');paragraph('Вычисления вложены: сначала from_environment создаёт Settings и автоматически проходит __post_init__. Затем main вызывает create_app; внутри него build_services вручную собирает сервисы, а сервисы получают репозитории, общую память и модельный клиент. После подключения обработчиков готовое приложение возвращается в main и передаётся uvicorn.run. Учебный обработчик CSV и его маршруты удалены.','notice');D.startup.forEach((id,i)=>$('details').append(link(id,(i+1)+'. '+D.startupNotes[i],N.get(id).file)));}
function coverage(){
 $('details').replaceChildren(el('div','eyebrow','Снимок исходников'),el('h2','','Охват и точность'));paragraph(`${D.meta.files} файлов · ${D.nodes.length} сущностей · ${D.edges.length} связей.`);paragraph('Собрано: '+new Date(D.meta.created).toLocaleString('ru-RU',{timeZone:'Europe/Moscow'})+' МСК');
 const table=el('table','coverage-table');for(const[k,v]of Object.entries(D.stats.kinds)){const tr=el('tr');tr.append(el('td','',names[k]||k),el('td','',String(v)));table.append(tr);}$('details').append(table);
 paragraph(`Выражений вызова со связанным адресатом: ${D.stats.resolved}; внешних / неразрешённых: ${D.stats.unresolved}. Извлечённых рёбер по имени/импорту: ${D.stats.edges.calls}; ссылок на методы: ${D.stats.edges.method_ref}; внешний вызов Uvicorn: ${D.stats.edges.external_call}. Ошибок синтаксического разбора: ${D.errors.length}.`,'notice');
 heading('Что означает связь');paragraph('«Вызывает» — лексическое или квалифицированное имя найдено через область/импорт, без исполнения. «Ссылка на метод» — связь через self/cls, тип TypeScript или вывод типа из единственного присваивания; реальная реализация во время работы не доказана. Неизвестные получатели остаются без адресата. Ручные HTTP/dataclass-пояснения имеют отдельные подписи и пунктир. «Использует» — чтение связанного имени; это не трассировка значения. «Содержит» — физическая или лексическая вложенность. При обзоре связи выбранного типа свёрнуты между родителями. Тип выбирается над диаграммой; число относится только к нему. На каждой странице показаны связи видимых сущностей. Полный список обращений выбранной сущности доступен в карточке.');
 for(const s of D.limitations)paragraph(s);
 heading('Версия');paragraph(`Корень: ${D.meta.root}\nВетка: ${D.meta.branch}\nHEAD: ${D.meta.head}\nSHA-256 снимка: ${D.meta.hash}`,'facts');
 paragraph('Пересобрать: node .dev/scripts/build-code-map.cjs','facts');paragraph('Генератор требует установленный TypeScript из frontend/node_modules и Python 3.9+. Путь Python можно передать через CODE_MAP_PYTHON. Сам HTML не требует этих инструментов.','subtle');
 const d=el('details');d.append(el('summary','','Разобранные файлы · '+D.meta.files));for(const[f,v]of Object.entries(D.files))d.append(link('file:'+f,f,v.parser+' · '+v.sha256.slice(0,12)));$('details').append(d);
 const r=el('details');r.append(el('summary','','Ресурсы без встраивания · '+D.excludedResources.length),el('pre','source',D.excludedResources.join('\n')));$('details').append(r);$('details').scrollTop=0;
}
function transform(){$('world').style.transform=`translate(${state.x}px,${state.y}px) scale(${state.scale})`;$('zoomvalue').value=Math.round(state.scale*100)+'%';}
function fit(readable=true){const w=$('viewport').clientWidth,h=$('viewport').clientHeight;state.scale=Math.max(.05,Math.min(1,(w-40)/state.width,(h-35)/state.height));state.x=Math.max(15,(w-state.width*state.scale)/2);state.y=Math.max(14,(h-state.height*state.scale)/2);transform();}
function zoom(factor,x=$('viewport').clientWidth/2,y=$('viewport').clientHeight/2){const next=Math.max(.18,Math.min(2.5,state.scale*factor)),ratio=next/state.scale;state.x=x-(x-state.x)*ratio;state.y=y-(y-state.y)*ratio;state.scale=next;transform();}
$('overview').onclick=()=>navigate('root');$('coverage').onclick=coverage;
$('up').onclick=()=>{if(state.tab==='c4'){const view=A.views.find(v=>v.id===state.archView);openArchitecture(view.parent||(view.id==='containers'?'context':'containers'));}else navigate(state.mode==='startup'?'group:launch':N.get(state.focus).parent||'root');};
$('plus').onclick=()=>zoom(1.2);$('fit').onclick=()=>fit(false);
for(const id of ['showvalues','showimports','showuses'])$(id).onchange=()=>{state.page=0;render();select(state.selected);fit();};
$('viewport').addEventListener('wheel',e=>{e.preventDefault();const r=$('viewport').getBoundingClientRect();zoom(e.deltaY<0?1.1:1/1.1,e.clientX-r.left,e.clientY-r.top);},{passive:false});
let drag=null;$('viewport').addEventListener('pointerdown',e=>{if(e.target.closest('button,[data-node]')||e.button!==0)return;drag={x:e.clientX,y:e.clientY,px:state.x,py:state.y};$('viewport').setPointerCapture(e.pointerId);$('viewport').classList.add('dragging');});
$('viewport').addEventListener('pointermove',e=>{if(!drag)return;state.x=drag.px+e.clientX-drag.x;state.y=drag.py+e.clientY-drag.y;transform();});
for(const type of ['pointerup','pointercancel'])$('viewport').addEventListener(type,()=>{drag=null;$('viewport').classList.remove('dragging');});
$('viewport').addEventListener('keydown',e=>{if(e.target!==$('viewport'))return;const step=45;if(e.key==='ArrowLeft')state.x+=step;else if(e.key==='ArrowRight')state.x-=step;else if(e.key==='ArrowUp')state.y+=step;else if(e.key==='ArrowDown')state.y-=step;else if(['+','='].includes(e.key)){zoom(1.2);return;}else if(e.key==='-'){zoom(1/1.2);return;}else if(e.key==='0'){fit();return;}else return;e.preventDefault();transform();});
function search(){const typed=$('search').value.trim(),raw=typed.toLowerCase(),terms=raw.split(/\s+/),nameTerms=typed.split(/\s+/).filter(t=>!/[.\/\\]/.test(t));$('results').replaceChildren();if(!raw){$('search').setAttribute('aria-expanded','false');return;}const score=n=>(nameTerms.length?nameTerms:[typed]).reduce((sum,t)=>sum+(n.name===t?125:n.name.toLowerCase()===t.toLowerCase()?100:n.name.toLowerCase().includes(t.toLowerCase())?10:0),0);const found=D.nodes.filter(n=>terms.every(t=>(n.name+' '+(n.file||'')+' '+title(n)+' '+scopeName(n)).toLowerCase().includes(t))).sort((a,b)=>score(b)-score(a)||a.name.length-b.name.length);for(const n of found.slice(0,70)){const b=button('',()=>{locate(n.id);$('results').replaceChildren();$('search').setAttribute('aria-expanded','false');},'result');b.append(el('strong','',n.name),el('small','',title(n)+' · '+(n.file||n.subtitle||'BERVEL')+(n.line?':'+n.line:'')),el('small','',scopeName(n)));$('results').append(b);}if(!found.length)$('results').append(el('div','empty','Совпадений нет. Попробуйте имя из кода.'));if(found.length>70)$('results').append(el('div','empty',`Первые 70 из ${found.length}. Добавьте часть пути или имя области.`));$('search').setAttribute('aria-expanded','true');}
$('search').addEventListener('input',search);$('search').addEventListener('keydown',e=>{if(e.key==='ArrowDown'){$('results').querySelector('button')?.focus();e.preventDefault();}if(e.key==='Enter')$('results').querySelector('button')?.click();if(e.key==='Escape'){$('results').replaceChildren();$('search').setAttribute('aria-expanded','false');}});
$('results').addEventListener('keydown',e=>{const buttons=[...$('results').querySelectorAll('button')],i=buttons.indexOf(document.activeElement);if(e.key==='ArrowDown'){buttons[(i+1)%buttons.length]?.focus();e.preventDefault();}if(e.key==='ArrowUp'){if(i===0)$('search').focus();else buttons[i-1]?.focus();e.preventDefault();}if(e.key==='Escape'){$('results').replaceChildren();$('search').focus();}});
document.addEventListener('click',e=>{if(!e.target.closest('.searchbox')){$('results').replaceChildren();$('search').setAttribute('aria-expanded','false');}});
document.addEventListener('keydown',e=>{if(e.key==='/'&&!['INPUT','TEXTAREA'].includes(document.activeElement.tagName)){e.preventDefault();$('search').focus();}if(e.altKey&&e.key==='ArrowUp'){e.preventDefault();$('up').click();}});
$('snapshot').textContent=`${D.meta.files} файлов · ${new Date(D.meta.created).toLocaleDateString('ru-RU',{timeZone:'Europe/Moscow'})} · ${D.meta.hash.slice(0,10)}`;
let resizeTimer;new ResizeObserver(()=>{clearTimeout(resizeTimer);resizeTimer=setTimeout(fit,100);}).observe($('viewport'));
initializeAtlas();
const hash=new URLSearchParams(location.hash.slice(1));state.tab=['c4','add'].includes(hash.get('tab'))?hash.get('tab'):'code';if(A.views.some(v=>v.id===hash.get('c4')))state.archView=hash.get('c4');if(AN.has(hash.get('entity')))state.archSelected=hash.get('entity');if([...$('relation-kind').options].some(o=>o.value===hash.get('relation')))$('relation-kind').value=hash.get('relation');if(N.has(hash.get('view'))){state.focus=hash.get('view');state.selected=N.has(hash.get('node'))?hash.get('node'):state.focus;state.mode=hash.get('mode')==='startup'?'startup':'normal';const list=visibleChildren(state.focus);state.page=Math.max(0,Math.floor(list.indexOf(state.selected)/pageSize));}render();if(state.tab==='c4')selectArchitecture(state.archSelected);else if(state.tab==='code')select(state.selected);fit();
</script>
