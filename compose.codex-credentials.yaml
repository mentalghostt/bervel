# Optional external secret. Source file is mounted read-only, never copied into the image.
services:
  codex:
    environment:
      BERVEL_CODEX_CREDENTIALS_FILE: /run/secrets/model-credentials
    volumes:
      - type: bind
        source: ${BERVEL_CODEX_CREDENTIALS_PATH:?Set an absolute path to an existing external credential file}
        target: /run/secrets/model-credentials
        read_only: true
        bind:
          create_host_path: false
