[build-system]
requires = ["setuptools==84.0.0", "wheel==0.48.0"]
build-backend = "setuptools.build_meta"

[project]
name = "bervel"
version = "0.1.0"
description = "BERVEL educational modular core"
requires-python = ">=3.12"
dependencies = [
  "fastapi==0.143.1", "uvicorn==0.54.0", "SQLAlchemy==2.0.54",
  "psycopg[binary]==3.3.6", "alembic==1.20.0", "jsonschema[format]==4.26.0",
  "python-multipart==0.0.32", "referencing==0.37.0"
]

[project.optional-dependencies]
dev = ["pytest==9.1.1", "httpx==0.28.1", "build==1.6.1"]

[project.scripts]
bervel = "bervel.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"bervel.core" = ["schemas/*.json"]
"bervel.modules.document_review" = ["manifest.json", "schemas/*.json"]

